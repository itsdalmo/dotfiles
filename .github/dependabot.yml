version: 2

# Weekly PRs, for releases that are at least three days old. The homebridge
# image in nix/machines/dalmolab/configuration.nix is not covered and is
# updated by hand.
updates:
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      flake:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
