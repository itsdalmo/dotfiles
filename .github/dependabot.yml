version: 2

# Daily PRs, for releases that are at least three days old. The stable nixpkgs
# channels skip the cooldown, so that security fixes aren't delayed.
updates:
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      exclude: ["nixpkgs", "nixpkgs-darwin"]
    groups:
      flake:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
